# Rejestr źródeł danych AED.
# poziom_zaufania: 1 – zweryfikowane (administracja publiczna), 2 – od dysponenta, 3 – społeczne.
# Wyższy poziom (niższa liczba) wygrywa przy scalaniu. Opis: docs/plan-techniczny.md.

[[source]]
id = "danegovpl-przemysl"
teryt = "1862011"   # gmina dysponenta (PRG)
adapter = "danegovpl"
nazwa = "Lokalizacje AED w Przemyślu"
dysponent = "Urząd Miejski w Przemyślu"
dataset_id = 4581
resource_id = 62093
format = "geojson"
licencja = "CC0-1.0"
poziom_zaufania = 1
url = "https://dane.gov.pl/pl/dataset/4581"

[source.kolumny]
id = "id"
lat = "_lat"
lon = "_lon"
nazwa_obiektu = "name"
miejscowosc = "city"
ulica = "street"
numer_budynku = "home_number"
kod_pocztowy = "postcode"
telefon = "phone"
zdjecie = "gallery"

